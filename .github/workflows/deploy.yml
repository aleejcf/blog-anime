name: Publicar el blog

on:
  # Cada vez que subes cambios.
  push:
    branches: [main]

  # El corazon de la automatizacion: reconstruye el sitio cada 3 horas.
  # Cualquier entrada cuya fecha (y hora) ya paso aparece en la siguiente
  # reconstruccion, asi que puedes programar entradas a distintas horas del dia.
  #
  # 8 ventanas al día, en UTC: 00 03 06 09 12 15 18 21
  # En Honduras (UTC-6):       18 21 00 03 06 09 12 15
  #
  # Los repos publicos tienen minutos de Actions ilimitados, asi que esto no
  # cuesta nada. OJO: el cron de GitHub NO es puntual — puede retrasarse entre
  # 5 y 20 minutos (a veces mas si hay mucha carga). La hora que pongas es un
  # "no antes de", no un reloj suizo.
  schedule:
    - cron: '0 */3 * * *'

  # Para poder lanzarlo a mano desde la pestana Actions.
  workflow_dispatch:

  # Para que auto-post.yml pueda desplegar despues de generar el boletin.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se solapan dos despliegues, gana el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
