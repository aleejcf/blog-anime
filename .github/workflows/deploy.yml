name: Publicar el blog

on:
  # Cada vez que subes cambios.
  push:
    branches: [main]

  # El corazon de la automatizacion: reconstruye el sitio todos los dias a las
  # 13:00 UTC. Cualquier entrada de la cola cuya fecha ya llego aparece sola.
  # (07:00 en CDMX, 08:00 en Bogota/Lima, 10:00 en Buenos Aires, 15:00 en Madrid)
  schedule:
    - cron: '0 13 * * *'

  # Para poder lanzarlo a mano desde la pestana Actions.
  workflow_dispatch:

  # Para que auto-post.yml pueda desplegar despues de generar el boletin.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se solapan dos despliegues, gana el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
